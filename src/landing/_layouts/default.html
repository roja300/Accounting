<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17211b">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  </head>
  <body class="page-{{ page.page_key | default: 'content' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Accounting home"><span class="brand-mark" aria-hidden="true">A</span><span>Accounting</span></a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a{% if page.page_key == 'overview' %} aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Overview</a>
          <a{% if page.page_key == 'getting-started' %} aria-current="page"{% endif %} href="{{ '/getting-started/' | relative_url }}">Get started</a>
          <a{% if page.page_key == 'guide' %} aria-current="page"{% endif %} href="{{ '/guide/' | relative_url }}">User guide</a>
          <a class="nav-repository" href="{{ site.github_url }}">Repository <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <div><a class="brand footer-brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">A</span><span>Accounting</span></a><p>Simple records. Clear invoices. Useful estimates.</p></div>
        <div class="footer-links"><a href="{{ '/getting-started/' | relative_url }}">Installation</a><a href="{{ '/guide/' | relative_url }}">User guide</a><a href="{{ site.github_url }}">Source on GitHub</a></div>
      </div>
    </footer>
  </body>
</html>
