services:
  backend:
    environment:
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: 8081
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/tls.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /https/tls.key
      Cors__AllowedOrigins__0: "https://localhost:${FRONTEND_PORT:-3000}"
      Https__Port: 8081
      Https__RedirectEnabled: "true"
    ports:
      - "${BACKEND_HTTPS_PORT:-8443}:8081"
    volumes:
      - "${HTTPS_CERTIFICATE_DIRECTORY:?Set HTTPS_CERTIFICATE_DIRECTORY}:/https:ro"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--insecure", "--silent", "https://localhost:8081/health/ready" ]

  frontend:
    environment:
      HTTPS_CERTIFICATE_PATH: /https/tls.crt
      HTTPS_KEY_PATH: /https/tls.key
      VITE_API_PROXY_TARGET: "http://backend:8080"
    volumes:
      - "${HTTPS_CERTIFICATE_DIRECTORY:?Set HTTPS_CERTIFICATE_DIRECTORY}:/https:ro"
    healthcheck:
      test: [ "CMD", "wget", "--no-check-certificate", "--quiet", "--output-document=-", "https://127.0.0.1:5173/" ]
